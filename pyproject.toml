[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-embedded-helper"
version = "0.1.0"
description = "MCP-based AI toolchain for embedded Linux developers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
mcp-embedded-helper = "mcp_embedded_helper.main:main"

[tool.setuptools.packages.find]
where = ["src"]
